  <main>

    <!-- PROJECT HERO -->
    <section class="project-hero project-hero--spaced">
      <div class="container">
        <p class="eyebrow">2022 - 2026</p>
        <h1>My Projects</h1>
        <p class="lead">Here you can read shortly about my design projects.</p>
      </div>
    </section>

    <!-- PROJECTS -->
    <section class="section section--dark section--projects">
      <div class="container">
        <!-- Cards are made from assets/projects.js: all projects, newest year first.
             Change the card below to change how every card looks. -->
        <div class="feature-grid" data-projects="all" data-sort="newest">
          <template>
            <a class="feature" data-field="page">
              <img class="card__img" data-field="teaser">
              <span class="feature__num" data-field="number"></span>
              <h3 data-field="title"></h3>
              <p data-field="summary"></p>
            </a>
          </template>
        </div>
      </div>
    </section>


    <!-- GALLERY -->
    <section class="section">
      <div class="container">
        <h2>A wild Julija has been seen...</h2>
      </div>

      <!-- Carousel: scrolls automatically, pauses on hover 
        <img class="teaser-gallery-img" src="assets/..." alt="...">   -->
      <div class="carousel">
        <div class="carousel__track">
          <div class="gallery gallery--mosaic">
            <img class="teaser-gallery-img" src="assets/details/Personal_Images/BlåSone_CloseUp_2026_343.JPG" 
              alt="Telenor Blå Sone Conference 2026">
            <img class="teaser-gallery-img" src="assets/details/Personal_Images/Barnivalen_2024.jpg" 
              alt="Barnivalen 2024">
            <img class="teaser-gallery-img" src="assets/details/Personal_Images/DS21_Exhibition1-1.jpg" 
              alt="Design Studio 21 course exhibition in Korea">
            <img class="teaser-gallery-img" src="assets/details/Personal_Images/DesignKorea_Conference_2025.jpg" 
              alt="Design Korea Conference 2025">
          </div>  

          <div class="gallery gallery--mosaic">
            <img class="teaser-gallery-img" src="assets/details/Personal_Images/DS72.JPG" 
              alt="Design Studio 72 course exhibition in Korea">
            <img class="teaser-gallery-img" src="assets/details/Personal_Images/STUNT_AHO_2022.jpg" 
              alt="STUNT AHO 2022">
            <img class="teaser-gallery-img" src="assets/details/Personal_Images/SV_Exhibition.jpg" 
              alt="Exhibition of our Semester Project 2026 for Sør-Varanger Utvikling in Kirkenes, Norway">
            <img class="teaser-gallery-img" src="assets/details/Personal_Images/StudioTassy_Improv&Vamp_2017.jpg" 
              alt="Designer Studio Tassy (Tassy Thompson)'s Improv & Vamp activity on Kongsberg Jazzfestival 2017">
          </div>

          <div class="gallery gallery--mosaic">
            <img class="teaser-gallery-img" src="assets/details/Personal_Images/SNU_Diploma.jpg" 
              alt="Julija holding her diploma in front of the SNU (Seoul National University) campus entrance in Seoul, Korea. ">
            <img class="teaser-gallery-img" src="assets/Project-Details/EnKomboTur/Entur_JulijaPoster.jpg" 
              alt="Hanging up our poster for the Entur project in Bergen, Norway.">
            <img class="teaser-gallery-img" src="assets/details/Personal_Images/SV_Feltarbeid-1.jpeg" 
              alt="Workshops for Sør-Varanger Utvikling in Kirkenes, Norway">
            <img class="teaser-gallery-img" src="assets/details/Personal_Images/Barnivalen_2023.jpg" 
              alt="Holding a 'Heija Bar' cup (Kirkenes, Norway)">
          </div>
        </div>
      </div>
